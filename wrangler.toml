# Cloudflare Workers static site (Vite SPA in app/frontend)
# Workers Builds: build command runs via [build], then wrangler deploy.
name = "neurodiver-co"
compatibility_date = "2025-09-23"

[build]
command = "npm run build:static"

[assets]
directory = "./app/frontend/dist"
not_found_handling = "single-page-application"
