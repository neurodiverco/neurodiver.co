"$schema" = "./node_modules/wrangler/config-schema.json"
main = ".open-next/worker.js"
name = "neurodiver-co"
compatibility_date = "2026-07-03"
compatibility_flags = [ "nodejs_compat" ]
# format = "service-worker"
# directory = ".next"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Next.js specific configuration
[build]
command = "pnpm build"

# Environment variables (add your production variables here)
[vars]
NODE_ENV = "production"
ADMIN_SECRET = "your_secure_admin_secret_here" # Change this in production!

# Cloudflare D1 database for waitlist storage
[[d1_databases]]
binding = "WAITLIST_DB"
database_name = "neurodiver-waitlist"
database_id = "a7da8697-3fb6-45ca-9865-8af32ddfb302"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
